    <path class="w-linea" d="M900,452 V612 M1165,442 V648"/>
    <path class="w-linea" d="M1640,418 V708 M1758,416 V712"/>
  </g>
  <g id="w-exterior">
    <path class="w-linea" d="M380,652 L800,628 L1150,700 L565,762 Z"/>
    <path class="w-linea" d="M705,656 L930,646 L1000,680 L780,690 Z"/>
    <path class="w-linea" d="M578,780 L1165,706 L1500,778 L888,904 Z"/>
    <path class="w-linea" d="M222,598 L905,1080 M1180,1080 L1920,846"/>
  </g>
  <g id="w-etiqueta">
    <circle class="w-dot" cx="1150" cy="700" r="5" fill="#FFF8EF" stroke="none"/>
    <circle class="w-dot" cx="1150" cy="700" r="12" stroke-width="1"/>
    <path class="w-linea w-leader" d="M1150,700 L1110,610 H950"/>
    <text class="w-label" x="1110" y="596" fill="#FFF8EF" stroke="none" font-family="Google Sans Flex, Google Sans, system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="4.3" text-anchor="end">PROYECTO</text>
  </g>
</svg>
