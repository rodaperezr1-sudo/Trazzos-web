<?xml version="1.0" encoding="UTF-8"?>
<!--
  TRAZZO · Capitulo 02 RENDER. Lineas tecnicas sobre assets/_web/video/hero-1080-primer-fotograma.jpg (1920x1080).
  Mismo viewBox que la foto: se superpone con preserveAspectRatio="xMidYMid slice" = object-fit:cover centrado.
  Grosor desde CSS (--sw). Orden de dibujo = orden del documento:
   .w-guia (guias de construccion, punteadas, mas tenues) -> .w-linea (aristas) -> .w-dot (anclaje) -> .w-label (PROYECTO).
  Salida: las .w-linea se "destrazan" (dashoffset a -1) y las guias se apagan.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" stroke="#FFF8EF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" id="wireframe">
  <title>Wireframe · PROYECTO</title>
  <g id="w-guias" stroke-opacity=".45">
    <path class="w-guia" d="M0,600 H1920"/>
    <path class="w-guia" d="M390,170 V700 M772,200 V700 M1165,300 V760 M1640,260 V820"/>
  </g>
  <g id="w-casa">
