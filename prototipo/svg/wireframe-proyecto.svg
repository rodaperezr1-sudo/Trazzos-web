    <path class="w-linea" d="M20,450 L775,462"/>
    <path class="w-linea" d="M60,586 L770,580"/>
    <path class="w-linea" d="M392,300 V585 M772,336 V580"/>
  </g>
  <g id="w-pabellon">
    <path class="w-linea" d="M850,435 L1172,430 L1172,384 L1920,302"/>
