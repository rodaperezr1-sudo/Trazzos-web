  TRAZZO · Boceto a mano (assets/_web/trazo/boceto-mano.jpg, 1920x2560) redibujado como trazos.
  Redibujado a mano (no Magnific: images_to_svg cotizaba 150 creditos, tope 30).
  viewBox 1659x2212 = la foto a escala 0,864: se superpone 1:1 a la foto con el mismo encuadre
  (object-fit/preserveAspectRatio iguales).
  Reglas para animar:
   - Cada <path> es una linea; el orden del documento ES el orden de dibujo (data-o).
   - Solo stroke, sin rellenos. El grosor se fija desde CSS (--sw) para que se vea 1-1.6 px en pantalla.
   - Se omitieron los textos manuscritos, flechas y numeros sueltos (ruido).
-->
